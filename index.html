<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIBI Bolos e Doces</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<img src="logo.png" class="logo">

<h1>BIBI Bolos e Doces</h1>

<p>Pequenos prazeres em grandes momentos ❤️</p>

</header>


<section class="pedido">

<h2>Faça seu pedido</h2>


<label>Escolha o produto:</label>

<select id="produto" onchange="atualizarProdutos()">

<option value="Brigadeiros">Brigadeiros</option>

<option value="Bolos">Bolos</option>

</select>



<label>Escolha o sabor:</label>

<select id="sabor">

<option>Chocolate</option>

<option>Ninho</option>

<option>Beijinho</option>

<option>Coco queimado</option>

<option>Prestígio</option>

<option>Limão</option>

<option>Laranja</option>

<option>Nutella</option>

<option>Oreo</option>

<option>Ferrero Rocher</option>

</select>


<label>Quantidade:</label>

<input type="number" id="quantidade" value="1" min="1">


<label>Observação:</label>

<textarea id="obs" placeholder="Ex: Quero para aniversário dia 10..."></textarea>


<button onclick="enviarWhatsapp()">

Enviar pedido pelo WhatsApp

</button>


</section>



<footer>

<p>WhatsApp: (69) 99395-5202</p>

</footer>



<script src="script.js"></script>

</body>

</html>
